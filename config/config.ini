[logger]
toFile = true 
level = debug 
append = false
filePath = C:/canc/minotauro.log

[index]
rootPath = C:/canc/testMino/
;rootPath = d:/volume_1
indexPath = C:/canc/index.txt
;indexPath = E:/index.txt
folderPath = C:/canc/folders.txt
;filter = *.{jpg,gif,raw,tif,nef,jpeg,bmp}
filter = *.{png,jpeg,bmp,nef,tif,cr2,gif,jpg,hdr,gtif}
folderSkipped=foto di altri,progetti fotografici,selezioni,ia

[transient]
;transientRootPath = E:/tsImages
transientDataPath = c:/canc/tsImages

[threads]
plugin_threads = MAX

[plugins]
;plugin_01 = FolderParseName
;plugin_02 = ImageId
plugin_01 = ImageFileData
;plugin_04 = ImageExif
;plugin_05 = ImageThumbnail
;plugin_06 = ImageTags
;plugin_07 = ImageDescription
;plugin_08 = ImageFaceRecognize

[ImageId]
enabled = true
plugin_threads = MAX
algorithm = sha-1

[ImageFileData]
enabled = true
plugin_threads = MAX
getImageSizePix = true

[ImageExif]
enabled = true
plugin_threads = MAX

[FolderParseName]
enabled = true
plugin_threads = MAX
parseDesc = true
enableWikipedia = false
; 2002 04.20-1 bla
regex01 = [0-9]{4}\s[0-9]{2}\.[0-9]{2}-[0-9]{1}.+
; 2002 04.20 bla
regex02 = [0-9]{4}\s[0-9]{2}\.[0-9]{2}\s.+
; 2002.05.20
regex03 = [0-9]{4}\.[0-9]{2}\.[0-9]{2}$
; 2002.05.20-bla
regex04 = [0-9]{4}\.[0-9]{2}\.[0-9]{2}-.+
; 2002.05.20 bla
regex05 = [0-9]{4}\.[0-9]{2}\.[0-9]{2}\s.+
; 2002.05 bla
regex06 = [0-9]{4}\.[0-9]{2}.+
; bla 10-02-2002 
regex07 = .+\s+[0-9]{2}-[0-9]{2}-[0-9]{4}$
; 10_02_2002 bla
regex08 = [0-9]{2}_[0-9]{2}_[0-9]{4}.+
; 2002-02-20
regex09 = [0-9]{4}-[0-9]{2}-[0-9]{2}$
; 2002-02-20 bla
regex10 = [0-9]{4}-[0-9]{2}-[0-9]{2}.+
; 2002 04 bla
regex11 = [0-9]{4}\s[0-9]{2}.+
; bla 2002
regex12 = .+\s+[0-9]{4}$
; 19xx
regex13 = [0-9]{2}xx$
; 2002
regex14 = [0-9]{4}$
; 2002 bla
regex15 = [0-9]{4}.+


[ImageThumbnail]
enabled = true
plugin_threads = MAX
maxSizePix = 800

[ImageTags]
enabled = false
plugin_threads = 1
modelName = gemma3
timeout = 120
tagNumber = 5
prompt = create %d tags for this image, in a single line with tags separated by comma

[ImageDescription]
enabled = false
plugin_threads = 1
maxLengthChar = 128
modelName = gemma3
timeout = 120
prompt = write a synthetic description of this image. You must use up to %d chars. Don't write any introduction, but the description only.

[ImageFaceRecognize]
enabled = false
plugin_threads = MAX